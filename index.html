<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт Контроль ✨</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --accent-green: #10b981;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        h2 { margin: 0 0 12px 0; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
        
        .progress-container {
            background: #e2e8f0;
            border-radius: 999px;
            height: 10px;
            width: 100%;
            margin: 12px 0 8px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: linear-gradient(90deg, var(--primary), #818cf8);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .stat-item {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }
        .stat-item span { color: var(--text-muted); display: block; margin-bottom: 2px; }
        .stat-item strong { font-size: 1rem; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            margin-top: 8px;
        }
        .btn-secondary { background: #e2e8f0; color: var(--text-main); margin-bottom: 8px; }

        .btn-furnace-small {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            margin-top: 5px;
        }

        .room-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .room-tag {
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .room-tag.active { background: var(--primary); color: white; }

        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
        .input-group input, .input-group select {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 0.95rem;
        }

        .expense-item {
            padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;
        }
        .expense-item:last-child { border: none; }
        .exp-info { display: flex; flex-direction: column; }
        .exp-meta { font-size: 0.75rem; color: var(--text-muted); }
        .exp-amount { font-weight: 700; color: var(--danger); }

        #flame-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none;
        }
    </style>
</head>
<body>

    <canvas id="flame-canvas"></canvas>

    <!-- Установка бюджета -->
    <div class="card" id="setup-card">
        <h2>🏛️ Начало ремонта</h2>
        <div class="input-group">
            <label>Задайте ваш изначальный плановый бюджет (₽):</label>
            <input type="number" id="init-budget" value="500000">
        </div>
        <button class="btn" onclick="startBudget()">Установить бюджет 📊</button>
    </div>

    <!-- Бюджет (Изначально скрыт, пока не введут сумму) -->
    <div class="card" id="budget-card" style="display:none;">
        <h2>📊 Бюджет Ремонта</h2>
        <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <span>Потрачено: <span id="percent-text" style="color:var(--primary);">0%</span></span>
            <span id="total-spent">0 ₽</span>
        </div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="stats-grid">
            <div class="stat-item">
                <span>План трат 🏛️</span>
                <strong id="ui-plan">0 ₽</strong>
            </div>
            <div class="stat-item">
                <span>Остаток 🪙</span>
                <strong id="budget-left" style="color: var(--accent-green);">0 ₽</strong>
            </div>
        </div>
    </div>

    <!-- Совместный доступ -->
    <div class="card" id="share-card" style="display:none;">
        <h2>👥 Совместный доступ</h2>
        <button class="btn btn-secondary" onclick="generatePartnerLink()">🔗 Связать устройства (Муж/Жена)</button>
        <div id="link-display" style="font-size:0.8rem; color:var(--accent-green); margin-top:5px; word-break:break-all;"></div>
    </div>

    <!-- Ввод трат -->
    <div class="card" id="input-card" style="display:none;">
        <h2>➕ Добавить Расход 💸</h2>
        <div class="input-group">
            <label>Имя или Ник (кто тратит):</label>
            <input type="text" id="user-name" placeholder="Например: Жена, Муж">
        </div>
        <div class="input-group">
            <label>Что куплено (Описание):</label>
            <input type="text" id="exp-desc" placeholder="Плитка, Краска, Оплата работы">
        </div>
        <div class="input-group">
            <label>Сумма (₽):</label>
            <input type="number" id="exp-val" placeholder="0">
        </div>
        <div class="input-group">
            <label>Зона / Комната 🧱:</label>
            <select id="exp-room">
                <option value="Кухня">🍳 Кухня</option>
                <option value="Ванная">🛁 Ванная</option>
                <option value="Спальня">🛏️ Спальня</option>
                <option value="Аванс прорабу">💸 Аванс прорабу</option>
            </select>
        </div>
        <button class="btn" onclick="addNewExpense()">Добавить в ленту ✨</button>
    </div>

    <!-- Фильтр комнат -->
    <div class="card" id="filter-card" style="display:none;">
        <h2>🧱 Фильтр зон</h2>
        <div class="room-tags" id="tags-list">
            <span class="room-tag active" onclick="filterRoom('Все', this)">Все 🏡</span>
            <span class="room-tag" onclick="filterRoom('Кухня', this)">🍳 Кухня</span>
            <span class="room-tag" onclick="filterRoom('Ванная', this)">🛁 Ванная</span>
            <span class="room-tag" onclick="filterRoom('Спальня', this)">🛏️ Спальня</span>
            <span class="room-tag" onclick="filterRoom('Аванс прорабу', this)">💸 Авансы</span>
        </div>
    </div>

    <!-- Лента расходов -->
    <div class="card" id="feed-card" style="display:none;">
        <h2>📜 Лента расходов</h2>
        <div id="expense-feed"></div>
    </div>

    <!-- Кнопка разгрузки -->
    <div class="card" id="furnace-card" style="display:none; text-align: center; background: #fff5f5; border: 1px solid #fee2e2;">
        <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Психологическая разгрузка:</span>
        <button class="btn btn-furnace-small" onclick="burnContractor()">🔥 Отправить прораба в кипящий котел</button>
    </div>

    <script>
        let planBudget = 0;
        let currentSpent = 0;

        function startBudget() {
            const val = parseInt(document.getElementById('init-budget').value);
            if (!val || val <= 0) return;
            planBudget = val;
            
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('budget-card').style.display = 'block';
            document.getElementById('share-card').style.display = 'block';
            document.getElementById('input-card').style.display = 'block';
            document.getElementById('filter-card').style.display = 'block';
            document.getElementById('feed-card').style.display = 'block';
            document.getElementById('furnace-card').style.display = 'block';
            
            updateBudgetUI();
        }

        function generatePartnerLink() {
            document.getElementById('link-display').innerText = "🔗 Ссылка скопирована! Отправьте её супругу(е).";
        }

        function updateBudgetUI() {
            let percent = planBudget > 0 ? Math.round((currentSpent / planBudget) * 100) : 0;
            document.getElementById('percent-text').innerText = percent + '%';
            document.getElementById('progress-bar').style.width = Math.min(percent, 100) + '%';
            document.getElementById('total-spent').innerText = currentSpent.toLocaleString() + ' ₽';
            document.getElementById('ui-plan').innerText = planBudget.toLocaleString() + ' ₽';
            document.getElementById('budget-left').innerText = (planBudget - currentSpent).toLocaleString() + ' ₽';
        }

        function addNewExpense() {
const name = document.getElementById('user-name').value || "Пользователь";
const desc = document.getElementById('exp-desc').value;
const val = parseInt(document.getElementById('exp-val').value);
const room = document.getElementById('exp-room').value;
if (!desc || !val) return;
currentSpent += val;
updateBudgetUI();
const feed = document.getElementById('expense-feed');
const item = document.createElement('div');
item.className = 'expense-item';
item.setAttribute('data-room', room);
item.innerHTML = <div class="exp-info"> <strong>${desc}</strong> <span class="exp-meta">${room} • ${name}</span> </div> <span class="exp-amount">-${val.toLocaleString()} ₽</span>;
feed.insertBefore(item, feed.firstChild);
document.getElementById('exp-desc').value = '';
document.getElementById('exp-val').value = '';
}
function filterRoom(room, element) {
document.querySelectorAll('.room-tag').forEach(tag => tag.classList.remove('active'));
element.classList.add('active');
document.querySelectorAll('.expense-item').forEach(item => {
if (room === 'Все' || item.getAttribute('data-room') === room) {
item.style.display = 'flex';
} else {
item.style.display = 'none';
}
});
}
function burnContractor() {
const canvas = document.getElementById('flame-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
canvas.style.display = 'block';
let particles = [];
function createParticle() {
return {
x: canvas.width / 2 + (Math.random() * 160 - 80),
y: canvas.height + 20,
speedX: Math.random() * 6 - 3,
speedY: Math.random() * -10 - 6,
radius: Math.random() * 35 + 15,
life: 1.0,
decay: Math.random() * 0.02 + 0.015
};
}
for(let i=0; i<50; i++) particles.push(createParticle());
let duration = 0;
function animateFlames() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.globalCompositeOperation = 'screen';
if (duration < 120) {
for(let i=0; i<6; i++) particles.push(createParticle());
}
for (let i = 0; i < particles.length; i++) {
let p = particles[i];
ctx.beginPath();
let gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
gradient.addColorStop(0, rgba(255, 150, 0, ${p.life}));
gradient.addColorStop(0.4, rgba(255, 50, 0, ${p.life * 0.5}));
gradient.addColorStop(1, 'rgba(0,0,0,0)');
ctx.fillStyle = gradient;
ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
ctx.fill();
p.x += p.speedX;
p.y += p.speedY;
p.life -= p.decay;
p.radius -= 0.2;
if (p.life <= 0 || p.radius <= 0) {
particles.splice(i, 1);
i--;
}
}
duration++;
if (particles.length > 0) {
requestAnimationFrame(animateFlames);
} else {
canvas.style.display = 'none';
}
}
animateFlames();
}
